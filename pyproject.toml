[project]
name = "graspgraph"
version = "0.1.0"
description = "LLM-planned robot arm in MuJoCo with failure recovery and a reproducible benchmark"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graspgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
