[project]
name = "graspgraph"
version = "0.1.0"
description = "LLM-planned robot arm in MuJoCo with failure recovery and a reproducible benchmark"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.17",
    "matplotlib>=3.11.2",
    "mujoco>=3.3",
    "numpy>=1.26",
]

[project.scripts]
graspgraph-bench = "graspgraph.bench.cli:main"
graspgraph-matrix = "graspgraph.bench.matrix_cli:main"

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graspgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running checks (full oracle validation); run with `pytest -m slow`"]
addopts = "-m 'not slow'"
